    <a class="wordmark" href="index.html" aria-label="Harshith, home">Harshith<span>.</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Me</a>

      <a href="mailto:hiharshith18@gmail.com">Say hello <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">
    <section class="pictures-intro" aria-labelledby="pictures-title">
      <h1 id="pictures-title">Through my lens<span class="period">.</span></h1>
      <p>A few frames I wanted to keep.</p>
    </section>
    <section class="pictures-grid" aria-label="Photography gallery">
      <figure class="photo-print gallery-reflections">
        <button type="button" data-photo="assets/sony-reflections.jpeg" data-caption="Reflections" aria-label="Enlarge Reflections photograph">
          <img src="assets/sony-reflections.jpeg" alt="Blue sky and brick buildings reflected in a glass facade" width="3072" height="3072">
          <span class="enlarge" aria-hidden="true">↗</span>
        </button>
        <figcaption><span class="frame-number">01 /</span> Reflections</figcaption>
      </figure>
      <figure class="photo-print gallery-last-light">
        <button type="button" data-photo="assets/sony-last-light.jpeg" data-caption="Last light" aria-label="Enlarge Last light photograph">
          <img src="assets/sony-last-light.jpeg" alt="A tree silhouetted against red and orange clouds at sunset" width="2121" height="2333">
          <span class="enlarge" aria-hidden="true">↗</span>
        </button>
        <figcaption><span class="frame-number">02 /</span> Last light</figcaption>
      </figure>
      <figure class="photo-print gallery-small-details">
        <button type="button" data-photo="assets/sony-small-details.jpeg" data-caption="Small details" aria-label="Enlarge Small details photograph">
          <img src="assets/sony-small-details.jpeg" alt="Delicate blue flowers against a dark green background" width="3072" height="3072" loading="lazy">
          <span class="enlarge" aria-hidden="true">↗</span>
        </button>
        <figcaption><span class="frame-number">03 /</span> Small details</figcaption>
      </figure>
      <figure class="photo-print gallery-by-the-water">
        <button type="button" data-photo="assets/sony-by-the-water.jpeg" data-caption="By the water" aria-label="Enlarge By the water photograph">
          <img src="assets/sony-by-the-water.jpeg" alt="A wave breaking over a pebbled shore with blue mountains in the distance" width="1440" height="1080" loading="lazy">
          <span class="enlarge" aria-hidden="true">↗</span>
        </button>
        <figcaption><span class="frame-number">04 /</span> By the water</figcaption>
      </figure>
      <figure class="photo-print gallery-bridge">
        <button type="button" data-photo="assets/bridge.jpeg" data-caption="Golden Gate Bridge" aria-label="Enlarge Golden Gate Bridge photograph">
          <img src="assets/bridge.jpeg" alt="Jets tracing the sky above the Golden Gate Bridge" width="1128" height="704" loading="lazy">
          <span class="enlarge" aria-hidden="true">↗</span>
        </button>
        <figcaption><span class="frame-number">05 /</span> Golden Gate Bridge</figcaption>
      </figure>
    </section>
    <dialog class="lightbox" aria-label="Photograph enlarged" aria-describedby="photo-caption">
      <button type="button" class="close-photo" aria-label="Close photograph" autofocus>×</button>
      <img src="assets/sony-reflections.jpeg" alt="">
      <p id="photo-caption"></p>
    </dialog>
  </main>

  </footer>
